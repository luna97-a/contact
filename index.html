<title>천왕중학교 비상연락망</title>
<style>
  :root{
    --ink:#1E2A38;
    --ink-soft:#4B5A69;
    --paper:#F5F3EE;
    --card:#FFFFFF;
    --line:#E4E0D6;
    --accent:#3F6E52;
    --accent-dark:#2E5240;
    --accent-soft:#E7EFE9;
    --danger:#B0503F;
    --danger-soft:#F5E5E1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 0 48px;}

  header{
    position:sticky;top:0;z-index:20;
    background:var(--ink);
    color:#fff;
    padding:18px 20px 16px;
  }
  header h1{
    margin:0 0 2px;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.2px;
  }
  .header-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .title-edit-btn{
    flex-shrink:0;
    border:1px solid rgba(255,255,255,0.35);
    background:transparent;
    color:#fff;
    border-radius:8px;
    padding:5px 10px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .title-edit-btn:active{background:rgba(255,255,255,0.15);}
  header p{
    margin:0;
    font-size:12.5px;
    color:#B9C2C9;
  }
  .toolbar{
    display:flex;
    gap:8px;
    padding:12px 20px;
    background:var(--paper);
    position:sticky;
    top:64px;
    z-index:19;
    border-bottom:1px solid var(--line);
  }
  .search{
    flex:1;
    display:flex;
    align-items:center;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:0 12px;
  }
  .search input{
    border:none;outline:none;background:transparent;
    width:100%;padding:10px 8px 10px 4px;font-size:15px;color:var(--ink);
  }
  .search svg{flex-shrink:0;color:var(--ink-soft);}
  .edit-toggle{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    border-radius:10px;
    padding:0 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .edit-toggle.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .banner{
    margin:12px 20px 0;
    padding:10px 12px;
    background:var(--accent-soft);
    border:1px solid var(--accent);
    color:var(--accent-dark);
    border-radius:10px;
    font-size:12.5px;
    line-height:1.5;
  }

  main{padding:8px 20px 0;}

  .dept{margin-top:24px;}
  .dept-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:2px solid var(--ink);
  }
  .dept-head h2{
    margin:0;
    font-size:15px;
    font-weight:700;
    letter-spacing:-0.1px;
  }
  .dept-head input{
    font-size:15px;
    font-weight:700;
    border:1px solid var(--line);
    border-radius:6px;
    padding:4px 8px;
    width:60%;
    background:#fff;
  }
  .dept-actions{display:flex;gap:6px;}
  .icon-btn{
    border:none;
    background:transparent;
    cursor:pointer;
    color:var(--ink-soft);
    padding:4px;
    font-size:13px;
    border-radius:6px;
  }
  .icon-btn.danger{color:var(--danger);}
  .icon-btn:active{background:var(--line);}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .member-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 14px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .member-row:last-child{border-bottom:none;}
  .member-row:active{background:var(--accent-soft);}
  .m-info{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .m-name{
    font-size:15.5px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .m-name .note{
    font-weight:400;
    color:var(--ink-soft);
    font-size:12.5px;
    margin-left:6px;
  }
  .m-phone{
    font-size:13px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .row-actions{
    display:flex;
    gap:8px;
    margin-left:10px;
    flex-shrink:0;
  }
  .call-icon, .sms-icon{
    flex-shrink:0;
    width:34px;height:34px;
    border:none;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent-dark);
    display:flex;align-items:center;justify-content:center;
    padding:0;
    cursor:pointer;
  }
  .sms-icon{
    background:#EAEFF3;
    color:var(--ink-soft);
  }
  .call-icon:active, .sms-icon:active{filter:brightness(0.94);}
  .row-edit-actions{display:flex;gap:4px;margin-left:10px;flex-shrink:0;}

  .add-member-btn{
    width:100%;
    padding:12px;
    border:none;
    background:var(--accent-soft);
    color:var(--accent-dark);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }

  .add-dept-btn{
    margin-top:28px;
    width:100%;
    padding:14px;
    border:1.5px dashed var(--ink-soft);
    background:transparent;
    color:var(--ink-soft);
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }

  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:60px 20px;
    font-size:14px;
  }

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1600);
}

function toTelHref(phone){
  const digits = (phone || '').replace(/[^\d]/g, '');
  if(!digits) return '#';
  if(digits.startsWith('0')) return 'tel:+82' + digits.slice(1);
  return 'tel:' + digits;
}

function toSmsHref(phone){
  const digits = (phone || '').replace(/[^\d]/g, '');
  if(!digits) return '#';
  if(digits.startsWith('0')) return 'sms:+82' + digits.slice(1);
  return 'sms:' + digits;
}

function uid(){
  return Math.random().toString(36).slice(2, 9);
}

function ensureIds(data){
  data.forEach(d => {
    if(!d.id) d.id = uid();
    d.members.forEach(m => { if(!m.id) m.id = uid(); });
  });
  return data;
}

async function loadAppTitle(){
  try{
    const res = await window.storage.get(TITLE_KEY, true);
    if(res && res.value){
      appTitle = res.value;
    } else {
      await window.storage.set(TITLE_KEY, appTitle, true);
    }
  } catch(e){
    // keep default appTitle
  }
  document.getElementById('headerTitle').textContent = appTitle;
}

async function saveAppTitle(newTitle){
  appTitle = newTitle;
  document.getElementById('headerTitle').textContent = appTitle;

    const result = await window.storage.set(TITLE_KEY, appTitle, true);
    if(!result){ showToast('이름 저장에 실패했어요.'); }
  } catch(e){

  }
}

function totalMembers(){
  return directory.reduce((sum, d) => sum + d.members.length, 0);
}

function render(){

          m.phone.includes(term) ||
          dept.dept.toLowerCase().includes(term))
      : dept.members;

    if(term && filteredMembers.length === 0 && !dept.dept.toLowerCase().includes(term)) return;

    () => {
      directory = directory.filter(d => d.id !== deptId);
      saveDirectory();
      render();
    }
  );
}

function confirmDeleteMember(deptId, memberId){
  const dept = directory.find(d => d.id === deptId);
  const member = dept.members.find(m => m.id === memberId);
  if(!member) return;
  openConfirmModal(
    '연락처를 삭제할까요?',
    '"' + member.name + '" 항목이 삭제돼요.',
    () => {
      dept.members = dept.members.filter(m => m.id !== memberId);
      saveDirectory();
      render();
    }
  );
}

function openConfirmModal(title, desc, onConfirm){
  modalRoot.innerHTML = '';
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e) => { if(e.target === overlay) modalRoot.innerHTML = ''; };

  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = '<h3>' + title + '</h3><p style="font-size:13.5px;color:var(--ink-soft);margin:-8px 0 18px;">' + desc + '</p>';

  const actions = document.createElement('div');
  actions.className = 'sheet-actions';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-secondary';
  cancelBtn.textContent = '취소';
  cancelBtn.onclick = () => { modalRoot.innerHTML = ''; };
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn btn-danger';
  confirmBtn.textContent = '삭제';
  confirmBtn.onclick = () => { modalRoot.innerHTML = ''; onConfirm(); };
  actions.appendChild(cancelBtn);
  actions.appendChild(confirmBtn);
  sheet.appendChild(actions);
  overlay.appendChild(sheet);
  modalRoot.appendChild(overlay);
}

function openMemberModal(deptId, memberId){
  const dept = directory.find(d => d.id === deptId);
  const isNew = !memberId;
  const member = isNew ? { name:'', phone:'', note:'' } : dept.members.find(m => m.id === memberId);

  modalRoot.innerHTML = '';
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e) => { if(e.target === overlay) modalRoot.innerHTML = ''; };

  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML =
    '<h3>' + (isNew ? '연락처 추가 · ' + dept.dept : '연락처 수정') + '</h3>' +
    '<div class="field"><label>이름</label><input id="fName" type="text" placeholder="예: 홍길동" value="' + (member.name || '').replace(/"/g,'&quot;') + '"></div>' +
    '<div class="field"><label>전화번호</label><input id="fPhone" type="tel" placeholder="예: 010-1234-5678" value="' + (member.phone || '').replace(/"/g,'&quot;') + '"></div>' +
    '<div class="field"><label>비고 (선택)</label><input id="fNote" type="text" placeholder="예: 배지, 보건 등" value="' + (member.note || '').replace(/"/g,'&quot;') + '"></div>';

  const actions = document.createElement('div');
  actions.className = 'sheet-actions';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-secondary';
  cancelBtn.textContent = '취소';
  cancelBtn.onclick = () => { modalRoot.innerHTML = ''; };
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-primary';
  saveBtn.textContent = '저장';
  saveBtn.onclick = () => {
    const name = sheet.querySelector('#fName').value.trim();
    const phone = sheet.querySelector('#fPhone').value.trim();
    const note = sheet.querySelector('#fNote').value.trim();
    if(!name || !phone){
      showToast('이름과 전화번호를 입력해 주세요.');
      return;
    }
    if(isNew){
      dept.members.push({ id: uid(), name, phone, note });
    } else {
      member.name = name;
      member.phone = phone;
      member.note = note;
    }
    modalRoot.innerHTML = '';
    saveDirectory();
    render();
  };
  actions.appendChild(cancelBtn);
  actions.appendChild(saveBtn);
  sheet.appendChild(actions);
  overlay.appendChild(sheet);
  modalRoot.appendChild(overlay);
  setTimeout(() => sheet.querySelector('#fName').focus(), 50);
}

document.getElementById('editToggle').addEventListener('click', () => {
  if(editMode){
    editMode = false;
    isAuthenticated = false;
    const btn = document.getElementById('editToggle');
    btn.textContent = '편집';
    btn.classList.remove('on');
    document.getElementById('titleEditBtn').style.display = 'none';
    render();
  } else {
    openPasswordModal();
  }
});

function openPasswordModal(){
  modalRoot.innerHTML = '';
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e) => { if(e.target === overlay) modalRoot.innerHTML = ''; };

  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML =
    '<h3>관리자 확인</h3>' +
    '<p style="font-size:13.5px;color:var(--ink-soft);margin:-8px 0 18px;">편집은 관리자 비밀번호를 입력한 경우에만 가능해요.</p>' +
    '<div class="field"><label>비밀번호</label><input id="fPassword" type="password" placeholder="비밀번호 입력" autocomplete="off"></div>';

  const actions = document.createElement('div');
  actions.className = 'sheet-actions';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-secondary';
  cancelBtn.textContent = '취소';
  cancelBtn.onclick = () => { modalRoot.innerHTML = ''; };
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn btn-primary';
  confirmBtn.textContent = '확인';
  const doCheck = async () => {
    const pw = sheet.querySelector('#fPassword').value;
    const hash = await sha256Hex(pw);
    if(hash === ADMIN_PASSWORD_HASH){
      isAuthenticated = true;
      editMode = true;
      modalRoot.innerHTML = '';
      const btn = document.getElementById('editToggle');
      btn.textContent = '완료';
      btn.classList.add('on');
      document.getElementById('titleEditBtn').style.display = 'inline-block';
      render();
    } else {
      showToast('비밀번호가 올바르지 않아요.');
    }
  };
  confirmBtn.onclick = doCheck;
  actions.appendChild(cancelBtn);
  actions.appendChild(confirmBtn);
  sheet.appendChild(actions);
  overlay.appendChild(sheet);
  modalRoot.appendChild(overlay);

  const pwInput = sheet.querySelector('#fPassword');
  setTimeout(() => pwInput.focus(), 50);
  pwInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') doCheck(); });
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  render();
});

loadAppTitle();
loadDirectory();
</script>
</body>
